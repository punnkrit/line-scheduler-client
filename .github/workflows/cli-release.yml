name: LINE CLI release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux, arch: amd64, cgo: '0'}
          - {os: ubuntu-latest, target: linux, arch: arm64, cgo: '0'}
          - {os: windows-latest, target: windows, arch: amd64, cgo: '0'}
          - {os: windows-latest, target: windows, arch: arm64, cgo: '0'}
          - {os: macos-latest, target: darwin, arch: arm64, cgo: '1'}
          - {os: macos-15-intel, target: darwin, arch: amd64, cgo: '1'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Verify security toolchain
        shell: bash
        run: ./scripts/check-toolchain.sh
      - name: Install vulnerability scanner
        shell: bash
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Build release
        shell: bash
        env:
          GOOS: ${{ matrix.target }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          ./scripts/check-toolchain.sh
          govulncheck ./cmd/line ./pkg/line/... ./pkg/e2ee ./pkg
          mkdir -p dist
          extension=""
          if [ "$GOOS" = "windows" ]; then extension=".exe"; fi
          go build -trimpath -ldflags "-w -X main.version=$GITHUB_REF_NAME -X main.distribution=fork" -o "dist/line$extension" ./cmd/line
          go version -m "dist/line$extension"
          govulncheck -mode=binary "dist/line$extension"
          cp LICENSE README*.md banner.png CHANGELOG.md AGENTS.md CONTRIBUTING.md dist/
          cp -R docs dist/
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "line$extension" > SHA256SUMS
          else
            shasum -a 256 "line$extension" > SHA256SUMS
          fi
          cd ..
          tar -czf "line-$GOOS-$GOARCH.tar.gz" -C dist .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: line-${{ matrix.target }}-${{ matrix.arch }}
          path: line-${{ matrix.target }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: line-*
          path: dist
          merge-multiple: true
      - name: Create archive checksums
        working-directory: dist
        run: sha256sum line-*.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/line-*.tar.gz dist/SHA256SUMS.txt
          --verify-tag
          --generate-notes
          --title "LINE CLI $GITHUB_REF_NAME"
